[mypy]
ignore_missing_imports = True
check_untyped_defs = False

# The ORM models use legacy Column(...) attributes, which mypy types as Column[T] instead of T.
# Converting every model to Mapped[T] is a separate refactor; until then only these two error
# classes are silenced, and only in the modules that touch ORM rows.
[mypy-app.api.routes,app.api.routes_alerts,app.api.routes_positions,app.api.validation,app.database,app.modules.screener.live_screener,app.modules.screener.intraday_monitor]
disable_error_code = arg-type,assignment,dict-item
